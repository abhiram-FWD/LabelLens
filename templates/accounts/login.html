{% extends "base.html" %}{% block title %}Log in | LabelLens{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h3 mb-4">Login</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}
{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label><input class="form-control" type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}" {% if field.field.widget.input_type == 'password' %}autocomplete="current-password"{% endif %} required>{{ field.errors }}</div>{% endfor %}
<input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary w-100">Login</button></form><p class="mt-3 mb-0">New here? <a href="{% url 'accounts:register' %}">Create an account</a>.</p>
</div></div></div></div>{% endblock %}
